<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تقارير المطعم</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/reports.css">

</head>
<style>
    /*=========================
    General
=========================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Cairo", sans-serif;
}

body{
    background:#f4f6f9;
}

/*=========================
    Title
=========================*/

h2{
    font-weight:bold;
    color:#2c3e50;
}

/*=========================
    Cards
=========================*/

.card{
    border:none;
    border-radius:15px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.card-header{
    font-size:20px;
    font-weight:bold;
    text-align:center;
}

/*=========================
    Statistics
=========================*/

.card-body h3{
    font-size:34px;
    font-weight:bold;
    color:#0d6efd;
}

.card-body small{
    font-size:15px;
    color:#666;
}

/*=========================
    Buttons
=========================*/

.btn{

    border-radius:10px;

    font-weight:bold;

    transition:.3s;

}

.btn:hover{

    transform:scale(1.03);

}

/*=========================
    Tables
=========================*/

.table{

    margin-bottom:0;

}

.table th{

    background:#2c3e50;

    color:white;

    text-align:center;

    vertical-align:middle;

}

.table td{

    text-align:center;

    vertical-align:middle;

    font-size:17px;

}

/* Zebra */

.table tbody tr:nth-child(even){

    background:#f8f9fa;

}

.table tbody tr:hover{

    background:#dbeafe;

    transition:.2s;

}

/*=========================
    Total Cards
=========================*/

.row .card{

    min-height:150px;

}

.row .card h5{

    font-size:30px;

}

.row .card h3{

    margin-top:10px;

}

/*=========================
    Date Input
=========================*/

input[type=date]{

    height:50px;

    border-radius:10px;

}

/*=========================
    Print
=========================*/

@media print{

    body{

        background:white;

    }

    .btn{

        display:none;

    }

    input{

        display:none;

    }

}

/*=========================
    Responsive
=========================*/

@media(max-width:768px){

    h2{

        font-size:24px;

    }

    .card-header{

        font-size:18px;

    }

    .table td{

        font-size:14px;

    }

    .table th{

        font-size:14px;

    }

    .card-body h3{

        font-size:26px;

    }

}
</style>

<body class="bg-light">

<div class="container py-4">

    <h2 class="text-center mb-4">
        📊 تقرير الوجبات اليومية
    </h2>
<div class="row mb-3">
    <div class="col-12">
        <div class="alert alert-primary text-center shadow-sm">

            <h4 id="reportTitle" class="mb-0">
                تقرير اليوم
            </h4>

        </div>
    </div>
</div>
    <div class="row mb-4">

    <div class="col-md-4 mb-2">

        <label class="mb-2 fw-bold">
            اختر تاريخ التقرير
        </label>

        <input
            type="date"
            id="reportDate"
            class="form-control">

    </div>

    <div class="col-md-2 mb-2 d-flex align-items-end">

        <button
            class="btn btn-primary w-100"
            onclick="loadReport()">

            عرض التقرير

        </button>

    </div>

    <div class="col-md-2 mb-2 d-flex align-items-end">

        <button
            class="btn btn-success w-100"
            onclick="window.print()">

            🖨️ طباعة

        </button>

    </div>

    <div class="col-md-2 mb-2 d-flex align-items-end">

        <button
            class="btn btn-warning w-100"
            onclick="loadReport()">

            🔄 تحديث

        </button>

    </div>

    </div>

    <!-- بطاقات الإحصائيات -->

    <div class="row text-center mb-4">

        <div class="col-md-2 col-6 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>👥</h5>

                    <h3 id="totalOrders">0</h3>

                    <small>عدد الطلبات</small>

                </div>

            </div>

        </div>

        <div class="col-md-2 col-6 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>🍳</h5>

                    <h3 id="breakfastCount">0</h3>

                    <small>الفطار</small>

                </div>

            </div>

        </div>

        <div class="col-md-2 col-6 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>🍗</h5>

                    <h3 id="lunchCount">0</h3>

                    <small>الغداء</small>

                </div>

            </div>

        </div>

        <div class="col-md-2 col-6 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>🌙</h5>

                    <h3 id="dinnerCount">0</h3>

                    <small>العشاء</small>

                </div>

            </div>

        </div>

        <div class="col-md-2 col-6 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>🍰</h5>

                    <h3 id="snackCount">0</h3>

                    <small>السناك</small>

                </div>

            </div>

        </div>

        <div class="col-md-2 col-6 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>🥗</h5>

                    <h3 id="saladCount">0</h3>

                    <small>السلطة</small>

                </div>

            </div>

        </div>

    </div>

    <!-- الفطار -->

    <div class="card mb-4 shadow">

        <div class="card-header bg-warning">

            🍳 الفطار

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                    <tr>

                        <th>الوجبة</th>

                        <th width="120">العدد</th>

                    </tr>

                </thead>

                <tbody id="breakfastTable"></tbody>

            </table>

        </div>

    </div>

    <!-- الغداء -->

    <div class="card mb-4 shadow">

        <div class="card-header bg-success text-white">

            🍗 الغداء

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                    <tr>

                        <th>الوجبة</th>

                        <th width="120">العدد</th>

                    </tr>

                </thead>

                <tbody id="lunchTable"></tbody>

            </table>

        </div>

    </div>

    <!-- العشاء -->

    <div class="card mb-4 shadow">

        <div class="card-header bg-primary text-white">

            🌙 العشاء

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                    <tr>

                        <th>الوجبة</th>

                        <th width="120">العدد</th>

                    </tr>

                </thead>

                <tbody id="dinnerTable"></tbody>

            </table>

        </div>

    </div>

    <!-- السناك -->

    <div class="card mb-4 shadow">

        <div class="card-header bg-danger text-white">

            🍰 السناك

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                    <tr>

                        <th>الوجبة</th>

                        <th width="120">العدد</th>

                    </tr>

                </thead>

                <tbody id="snackTable"></tbody>

            </table>

        </div>

    </div>

    <!-- السلطة -->

    <div class="card mb-5 shadow">

        <div class="card-header bg-info text-white">

            🥗 السلطة

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                    <tr>

                        <th>الصنف</th>

                        <th width="120">العدد</th>

                    </tr>

                </thead>

                <tbody id="saladTable"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="reports.js"></script>

</body>

</html>
